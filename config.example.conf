# setup-ubuntu-workstation — what to install: 1 = yes, 0 = no.
# The numbers match the tool table in the README. `sudo ./setup.sh install`
# copies this file to /etc/setup-ubuntu-workstation/config.conf on the first
# run; change values there with: sudo ./setup.sh config set KEY VALUE

# ---- A. Terminal and shell --------------------------------------------------
KITTY=1              # 1  kitty: Windows-Terminal-like terminal (default terminal)
GHOSTTY=1            # 2  Ghostty: second terminal, to compare with kitty
PTYXIS=1             # 69 Ptyxis (GNOME's "Terminal", with bash) set up like Windows Terminal
FILES_OPEN_IN=1      # 72 Files app: "Open in kitty / Ghostty / Terminal / VS Code / Antigravity IDE"
QUAKE_TERMINAL=0     # 3  Drop-down terminal on F12 (GNOME extension "Quake Terminal")
PWSH=1               # 4  PowerShell 7 LTS, the shell in kitty and Ghostty
PWSH_PROFILE=1       # 5  pwsh profile: Windows editing keys, predictions, prompt
STARSHIP=1           # 6  starship prompt (bash; pwsh has its git prompt)
ZOXIDE=0             # 7  zoxide: smarter cd
CASCADIA=1           # 8  Cascadia Code / Mono fonts (Windows Terminal's font)
NERD_FONTS=1         # 9  Nerd Fonts: Caskaydia, FiraCode, JetBrains Mono

# ---- B. Browsers, editors, IDEs ---------------------------------------------
CHROME=1             # 10 Google Chrome
EDGE=1               # 66 Microsoft Edge
CHROMIUM=1           # 67 Chromium (snap)
VSCODE=1             # 11 Visual Studio Code
ANTIGRAVITY=1        # 12 Google Antigravity IDE (2.x, Google's tarball)
JETBRAINS_TOOLBOX=1  # 13 JetBrains Toolbox
NEOVIM=1             # 14 Neovim and Vim
BCOMPARE=1           # 15 Beyond Compare (needs a licence)

# ---- C. AI coding agents -----------------------------------------------------
CLAUDE_CODE=1        # 16 Claude Code (+ sandbox: bubblewrap, socat, AppArmor profile)
CLAUDE_CHANNEL="latest"  #    apt channel: latest (newest) or stable
CODEX=1              # 17 OpenAI Codex CLI
AGY=1                # 18 Google Antigravity CLI (agy)
MUSE=1               # 68 Meta Muse Code CLI (muse)
OPENCODE=1           # 70 OpenCode CLI (opencode)

# ---- D. Git and GitHub -------------------------------------------------------
GIT=1                # 19 git, newest (git-core PPA)
GH=1                 # 20 GitHub CLI (gh)
GIT_LFS=1            # 21 git-lfs
LAZYGIT=1            # 22 lazygit
DELTA=0              # 23 delta (nicer git diffs)

# ---- E. Command-line tools ---------------------------------------------------
JQ=1                 # 24 jq
YQ=1                 # 25 yq (mikefarah)
RIPGREP=1            # 26 ripgrep
FD=1                 # 27 fd
FZF=1                # 28 fzf
BAT=1                # 29 bat
SEVENZIP=1           # 30 7-Zip
MC=1                 # 31 Midnight Commander
BASICS=1             # 32 curl, wget, tree, htop, openssl, unzip

# ---- F. Languages --------------------------------------------------------------
NODE=1               # 33 Node.js via nvm only: newest LTS, set as the default
YARN_PNPM=1          # 34 yarn and pnpm (Corepack, on the nvm Node)
PYTHON=1             # 35 Python via uv (newest)
GO=1                 # 36 Go
JAVA=0               # 37 Java (OpenJDK LTS) — also pulled in by MAVEN / FLUTTER
MAVEN=0              # 38 Maven (needs Java)
FLUTTER=1            # 39 Flutter + Android SDK (pulls in Java)
RUST=0               # 40 Rust (rustup)
DOTNET=0             # 41 .NET SDK

# ---- G. Database clients -------------------------------------------------------
PSQL=1               # 42 PostgreSQL client (psql)
MONGOSH=1            # 43 MongoDB shell (mongosh)
REDIS_CLI=1          # 44 redis-cli
MYSQL_CLIENT=1       # 45 MySQL client

# ---- H. Containers and Kubernetes ----------------------------------------------
DOCKER_CLI=1         # 46 Docker CLI + buildx + compose (remote hosts via docker context)
DOCKER_ENGINE=1      # 47 Docker Engine (local containers; no Docker Desktop)
KUBECTL=1            # 48 kubectl
HELM=1               # 49 helm
KIND=0               # 50 kind
K9S=0                # 51 k9s
KUBECTX=1            # 52 kubectx / kubens
STERN=0              # 53 stern
KREW=0               # 54 krew
CMCTL=0              # 55 cmctl (cert-manager)
ARGOCD=1             # 56 Argo CD CLI
TKN=1                # 57 Tekton CLI (tkn)
ARGO=0               # 58 Argo Workflows + Rollouts CLIs

# ---- I. Cloud ----------------------------------------------------------------------
AZURE_CLI=1          # 59 Azure CLI
GCLOUD=1             # 60 Google Cloud CLI
TERRAFORM=1          # 61 Terraform
VAULT=1              # 62 Vault
MKCERT=1             # 63 mkcert

# ---- J. Setup ------------------------------------------------------------------------
GIT_USER_NAME=""     # 64 git identity; empty = asked interactively (if not set yet)
GIT_USER_EMAIL=""
LOGINS=1             # 65 interactive logins at the end: gh, Claude Code, Codex, agy, Muse
CONFIGS_REPO=""      #    your own config repository, OWNER/NAME (./setup.sh configs; see README)
