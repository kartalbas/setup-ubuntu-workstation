# Managed by setup-ubuntu-workstation: Ghostty set up like Windows Terminal, as
# far as Ghostty goes. Your own settings go into local.conf next to this file:
# loaded last, never overwritten.

# ---- Shell and window ----------------------------------------------------------
@GHOSTTY_COMMAND@
# The shell sets the tab title (the current directory's name).
shell-integration-features = no-title
window-width = 120
window-height = 30
window-padding-x = 6
window-padding-y = 6
# New tabs start at home, new panes where the current one is (as in kitty here).
tab-inherit-working-directory = false
split-inherit-working-directory = true
window-new-tab-position = end
confirm-close-surface = false

# ---- Look: Windows Terminal's defaults (Cascadia Mono 12, Campbell, bar cursor)
font-family = Cascadia Mono
font-size = 12
# Windows Terminal rounds each cell up (Cascadia Mono 12 pt is 9.375 px wide:
# 10 x 20 px); Ghostty rounds down (9 x 19), which squeezes the text. One
# pixel more each way gives Windows Terminal's cell.
adjust-cell-width = 1
adjust-cell-height = 1
cursor-style = bar
cursor-style-blink = true
background = #0C0C0C
foreground = #CCCCCC
cursor-color = #FFFFFF
selection-background = #494949
selection-foreground = cell-foreground
palette = 0=#0C0C0C
palette = 1=#C50F1F
palette = 2=#13A10E
palette = 3=#C19C00
palette = 4=#0037DA
palette = 5=#881798
palette = 6=#3A96DD
palette = 7=#CCCCCC
palette = 8=#767676
palette = 9=#E74856
palette = 10=#16C60C
palette = 11=#F9F1A5
palette = 12=#3B78FF
palette = 13=#B4009E
palette = 14=#61D6D6
palette = 15=#F2F2F2

# ---- Mouse: selecting does not copy, right click copies the selection or
# pastes, Ctrl+click opens links (Ghostty's default), double-click stops at
# Windows Terminal's word delimiters. Tabs: drag to move them, right click on a
# tab for "Change Tab Title…".
copy-on-select = false
right-click-action = copy-or-paste
selection-word-chars = " \t/\\()\"'-.,:;<>~!@#$%^&*|+=[]{}?│"

# ---- Keys: Windows Terminal's defaults and nothing else. Every other Ghostty
# action is in the command palette (Ctrl+Shift+P).
keybind = clear
# clipboard (Ctrl+C copies only with a selection, else it reaches the shell)
keybind = performable:ctrl+c=copy_to_clipboard
keybind = ctrl+shift+c=copy_to_clipboard
keybind = ctrl+insert=copy_to_clipboard
keybind = ctrl+v=paste_from_clipboard
keybind = ctrl+shift+v=paste_from_clipboard
keybind = shift+insert=paste_from_clipboard
keybind = ctrl+shift+a=select_all
# search, command palette
keybind = ctrl+shift+f=start_search
keybind = ctrl+shift+p=toggle_command_palette
# tabs, windows
keybind = ctrl+shift+t=new_tab
keybind = ctrl+shift+n=new_window
keybind = ctrl+tab=next_tab
keybind = ctrl+shift+tab=previous_tab
keybind = ctrl+alt+1=goto_tab:1
keybind = ctrl+alt+2=goto_tab:2
keybind = ctrl+alt+3=goto_tab:3
keybind = ctrl+alt+4=goto_tab:4
keybind = ctrl+alt+5=goto_tab:5
keybind = ctrl+alt+6=goto_tab:6
keybind = ctrl+alt+7=goto_tab:7
keybind = ctrl+alt+8=goto_tab:8
keybind = ctrl+alt+9=goto_tab:9
# panes
keybind = ctrl+shift+w=close_surface
keybind = alt+shift+plus=new_split:right
keybind = alt+shift+equal=new_split:right
keybind = alt+shift+numpad_add=new_split:right
keybind = alt+shift+minus=new_split:down
keybind = alt+shift+numpad_subtract=new_split:down
keybind = alt+shift+d=new_split:auto
keybind = alt+arrow_left=goto_split:left
keybind = alt+arrow_right=goto_split:right
keybind = alt+arrow_up=goto_split:up
keybind = alt+arrow_down=goto_split:down
keybind = ctrl+alt+arrow_left=goto_split:previous
keybind = alt+shift+arrow_left=resize_split:left,30
keybind = alt+shift+arrow_right=resize_split:right,30
keybind = alt+shift+arrow_up=resize_split:up,30
keybind = alt+shift+arrow_down=resize_split:down,30
# scrolling
keybind = ctrl+shift+arrow_up=scroll_page_lines:-1
keybind = ctrl+shift+arrow_down=scroll_page_lines:1
keybind = ctrl+shift+page_up=scroll_page_up
keybind = ctrl+shift+page_down=scroll_page_down
keybind = ctrl+shift+home=scroll_to_top
keybind = ctrl+shift+end=scroll_to_bottom
# zoom, full screen
keybind = ctrl+plus=increase_font_size:1
keybind = ctrl+equal=increase_font_size:1
keybind = ctrl+numpad_add=increase_font_size:1
keybind = ctrl+minus=decrease_font_size:1
keybind = ctrl+numpad_subtract=decrease_font_size:1
keybind = ctrl+0=reset_font_size
keybind = ctrl+numpad_0=reset_font_size
keybind = alt+enter=toggle_fullscreen
keybind = f11=toggle_fullscreen

config-file = ?local.conf
