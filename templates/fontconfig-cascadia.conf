<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Managed by setup-ubuntu-workstation: Cascadia (Windows Terminal's font)
     drawn as Windows draws it, placed by the hints built into the font.
     Ubuntu's default, hintslight, has FreeType use its auto-hinter for it
     instead, which rounds the lower case at 12 pt (8.28 px) up to 9 px where
     Windows has 8: every letter a pixel taller, the text looks squeezed. -->
<fontconfig>
  <match target="font">
    <test name="family" compare="contains"><string>Cascadia</string></test>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
</fontconfig>
