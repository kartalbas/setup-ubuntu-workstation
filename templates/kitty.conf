# Managed by setup-ubuntu-workstation: kitty set up like Windows Terminal.
# Your own settings go into local.conf next to this file (Ctrl+, opens it):
# loaded last, never overwritten, applied as soon as you save it.

# ---- Shell and window ----------------------------------------------------------
shell                       @KITTY_SHELL@
# The shell sets the tab title (the current directory's name); kitty's shell
# integration would replace it.
shell_integration           enabled no-title
# GNOME does not decorate Wayland windows: through XWayland it draws kitty's
# title bar itself, so moving, resizing and snapping work like for any window.
linux_display_server        x11
initial_window_width        120c
initial_window_height       30c
remember_window_size        no
window_padding_width        6
# Ask before closing a window that holds more than one tab or pane.
confirm_os_window_close     2
# Updates come with setup-ubuntu-workstation (versions.conf), not from kitty.
update_check_interval       0

# ---- Look: Windows Terminal's defaults (Cascadia Mono 12, Campbell, bar cursor)
font_family                 family="Cascadia Mono"
font_size                   12.0
# Windows Terminal rounds each cell up (Cascadia Mono 12 pt is 9.375 px wide:
# 10 × 20 px); kitty rounds down (9 × 19), which squeezes the text. One pixel
# more each way gives Windows Terminal's cell.
modify_font                 cell_width 1px
modify_font                 cell_height 1px
cursor_shape                beam
scrollback_lines            9001
scrollbar                   always
foreground                  #CCCCCC
background                  #0C0C0C
cursor                      #FFFFFF
cursor_text_color           background
selection_foreground        none
selection_background        #494949
color0                      #0C0C0C
color1                      #C50F1F
color2                      #13A10E
color3                      #C19C00
color4                      #0037DA
color5                      #881798
color6                      #3A96DD
color7                      #CCCCCC
color8                      #767676
color9                      #E74856
color10                     #16C60C
color11                     #F9F1A5
color12                     #3B78FF
color13                     #B4009E
color14                     #61D6D6
color15                     #F2F2F2
active_border_color         #0078D4
inactive_border_color       #3A3A3A

# ---- Tabs: always shown, with a "+" button. kitty itself renames a tab on
# double-click, moves it by dragging (also into a new window) and closes it on
# middle click.
tab_bar_edge                top
tab_bar_min_tabs            1
tab_bar_show_new_tab_button yes
tab_bar_style               separator
tab_separator               ""
tab_title_template          "  {fmt.fg.red}{bell_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}  "
tab_title_max_length        40
tab_bar_margin_height       4.0 0.0
tab_bar_margin_color        #202020
tab_bar_background          #202020
active_tab_background       #0C0C0C
active_tab_foreground       #FFFFFF
active_tab_font_style       normal
inactive_tab_background     #202020
inactive_tab_foreground     #A0A0A0
inactive_tab_font_style     normal
# Panes are splits (Alt+Shift+Plus/Minus/D); their dividers can be dragged.
enabled_layouts             splits,stack

# ---- Mouse -------------------------------------------------------------------------
copy_on_select              no
strip_trailing_spaces       smart
# Double-click selects letters, digits and _ only (Windows Terminal's word
# delimiters).
select_by_word_characters   _
# A click only selects; Ctrl+click opens a link.
mouse_map left click ungrabbed mouse_handle_click selection
mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection
mouse_map ctrl+left press grabbed discard_event
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
# Alt+drag selects a block.
mouse_map alt+left press ungrabbed mouse_selection rectangle
# Right click copies the selection, otherwise it pastes.
mouse_map right press ungrabbed kitten windows_terminal.py copy_or_paste

# ---- Keys: Windows Terminal's defaults and nothing else. Every other kitty
# action is in the command palette (Ctrl+Shift+P).
clear_all_shortcuts         yes
# clipboard
map ctrl+c                  copy_and_clear_or_interrupt
map ctrl+shift+c            copy_to_clipboard
map ctrl+insert             copy_to_clipboard
map ctrl+v                  paste_from_clipboard
map ctrl+shift+v            paste_from_clipboard
map shift+insert            paste_from_clipboard
# search, command palette, profile menu, own settings
map ctrl+shift+f            search_scrollback
map ctrl+shift+p            command_palette
map ctrl+shift+space        launch --type=overlay --allow-remote-control @KITTY_CONFIG_DIR@/profiles.sh @KITTY_PROFILES@
map ctrl+comma              @KITTY_EDIT_LOCAL@
# tabs
map ctrl+shift+t            new_tab
@KITTY_PROFILE_KEYS@
map ctrl+shift+d            launch --type=tab --cwd=current --copy-cmdline
map ctrl+tab                next_tab
map ctrl+shift+tab          previous_tab
map ctrl+alt+1              goto_tab 1
map ctrl+alt+2              goto_tab 2
map ctrl+alt+3              goto_tab 3
map ctrl+alt+4              goto_tab 4
map ctrl+alt+5              goto_tab 5
map ctrl+alt+6              goto_tab 6
map ctrl+alt+7              goto_tab 7
map ctrl+alt+8              goto_tab 8
map ctrl+alt+9              goto_tab 9
map ctrl+shift+n            new_os_window
# panes
map ctrl+shift+w            close_window
map alt+shift+plus          launch --location=vsplit --cwd=current --copy-cmdline
map alt+shift+equal         launch --location=vsplit --cwd=current --copy-cmdline
map alt+shift+kp_add        launch --location=vsplit --cwd=current --copy-cmdline
map alt+shift+minus         launch --location=hsplit --cwd=current --copy-cmdline
map alt+shift+underscore    launch --location=hsplit --cwd=current --copy-cmdline
map alt+shift+kp_subtract   launch --location=hsplit --cwd=current --copy-cmdline
map alt+shift+d             launch --location=split --cwd=current --copy-cmdline
map alt+left                neighboring_window left
map alt+right               neighboring_window right
map alt+up                  neighboring_window up
map alt+down                neighboring_window down
map ctrl+alt+left           nth_window -1
map alt+shift+left          kitten windows_terminal.py resize left
map alt+shift+right         kitten windows_terminal.py resize right
map alt+shift+up            kitten windows_terminal.py resize up
map alt+shift+down          kitten windows_terminal.py resize down
# scrolling
map ctrl+shift+up           scroll_line_up
map ctrl+shift+down         scroll_line_down
map ctrl+shift+page_up      scroll_page_up
map ctrl+shift+page_down    scroll_page_down
map ctrl+shift+home         scroll_home
map ctrl+shift+end          scroll_end
# zoom, full screen
map ctrl+plus               change_font_size current +1
map ctrl+equal              change_font_size current +1
map ctrl+kp_add             change_font_size current +1
map ctrl+minus              change_font_size current -1
map ctrl+kp_subtract        change_font_size current -1
map ctrl+0                  change_font_size current 0
map ctrl+kp_0               change_font_size current 0
map alt+enter               toggle_fullscreen
map f11                     toggle_fullscreen

globinclude local.conf
